[project]
name = "dozer"
version = "0.1.0"
description = "FRC Discord bot"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "aiotba~=0.0.3.post1",
    "asyncpg==0.26.0",
    "beautifulsoup4",
    "discord.py[speed,voice]==2.7.1",
    "feedparser",
    "fuzzywuzzy~=0.18.0",
    "geopy~=2.5.0",
    "googlemaps~=4.4.2",
    "humanize>=4.16.0",
    "loguru~=0.6.0",
    "pre-commit~=2.20.0",
    "python-Levenshtein",
    "python-dateutil~=2.8.1",
    "rstcloth~=0.3.1",
    "sentry-sdk",
    "tbapi~=1.3.1b5",
]

[dependency-groups]
dev = [
    "pylint",
]
